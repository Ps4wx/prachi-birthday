<style>
  *{box-sizing:border-box;margin:0;padding:0}

  #scene{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);height:min(76vh,600px);width:auto;z-index:2;overflow:visible}

  .t.go{animation:draw 2.2s ease forwards}

  @keyframes flick{

    background:linear-gradient(135deg,#ff5fa2,#ff8a5f);cursor:pointer;box-shadow:0 6px 20px rgba(255,95,162,.45)}
  #kiss{position:fixed;left:50%;bottom:max(4vh,env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;align-items:center;

  #kiss span{font-size:54px;animation:pulse 1.2s ease-in-out infinite}

  /* balloons */
  #balloons{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:15}
  .balloon{position:absolute;bottom:-220px;animation:rise linear forwards;will-change:transform}
  @keyframes rise{to{transform:translateY(-135vh)}}
  .b{position:relative;border-radius:50% 50% 47% 47%/45% 45% 55% 55%;animation:sway ease-in-out infinite alternate;
    box-shadow:inset -8px -10px 18px rgba(0,0,0,.25)}
  .b::before{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:10px;background:inherit;transform:translateX(-50%);
    clip-path:polygon(50% 0,0 100%,100% 100%);filter:brightness(.8)}
  .b::after{content:"";position:absolute;left:50%;top:99%;width:1.5px;height:90px;background:rgba(255,255,255,.55);transform-origin:top;animation:str 2s ease-in-out infinite alternate}
  .shine{position:absolute;left:20%;top:14%;width:22%;height:30%;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(30deg);filter:blur(1px)}
  @keyframes sway{from{transform:translateX(-18px) rotate(-5deg)}to{transform:translateX(18px) rotate(5deg)}}
  @keyframes str{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
</style>

<script>
/* ====== CONFIG (apne files ke hisaab se badlo) ====== */
const SONG_SRC  = 'song.mp3';      // wahi song jo pichle page pe chal raha tha
const VOICE_SRC = 'voice.mp3';     // tumhara voice message
const NEXT_URL  = 'page6.html';              // song resume hone ke baad kahan jana hai ('' = yahin rahe)
const SONG_KEY  = 'st';
const PIN  = '8978';   // <-- apna secret code (sirf digits, kitne bhi). 20 Nov ko yahi badalna
const HINT = '';       // 3 galat try ke baad dikhega. '' = koi hint nahi      // pichle page pe: localStorage.setItem('songTime', audio.currentTime)
/* ===================================================== */

const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const song = new Audio(SONG_SRC); song.loop = true;
const voice = new Audio(VOICE_SRC);
addEventListener('pagehide', () => { if(!song.paused){ try{localStorage.setItem(SONG_KEY, song.currentTime)}catch(e){} } });
song.addEventListener('loadedmetadata', () => { try { song.currentTime = parseFloat(localStorage.getItem(SONG_KEY)) || 0; } catch(e){} }, {once:true});
song.load();

/* ---- glow / spotlight ---- */
const glowEl = $('glow');
let g = {r:2400, a:0}, lit = false, t0 = performance.now();
function centre(){
  const r = $('scene').getBoundingClientRect();
  return [r.left + r.width*.5, r.top + r.height*.62];
}
function drawGlow(){
  const [x,y] = centre();
  let a = g.a, r = g.r;
  if(lit){ const t=(performance.now()-t0)/1000; a *= 1 + .08*Math.sin(t*17) + .05*Math.sin(t*7.3); r *= 1 + .02*Math.sin(t*11); }
  glowEl.style.background =
    `radial-gradient(circle at ${x}px ${y}px, rgba(255,214,150,${a}) 0, rgba(255,175,95,${a*.4}) ${r*.45}px, transparent ${r}px)`;
  requestAnimationFrame(drawGlow);
}
requestAnimationFrame(drawGlow);
function tweenGlow(r, a, ms){
  const s = {...g}, st = performance.now();
  return new Promise(res => {
    (function step(n){
      const k = Math.min(1,(n-st)/ms), e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
      g.r = s.r+(r-s.r)*e; g.a = s.a+(a-s.a)*e;
      k<1 ? requestAnimationFrame(step) : res();
    })(st);
  });
}
function fadeVol(audio, to, ms){
  const from = audio.volume, st = performance.now();
  return new Promise(res => (function s(n){
    const k = Math.min(1,(n-st)/ms); audio.volume = Math.max(0,Math.min(1,from+(to-from)*k));
    k<1 ? requestAnimationFrame(s) : res();
  })(st));
}
function say(text, ms){
  const m = $('msg'); m.textContent = text; m.classList.add('show');
  if(ms) setTimeout(() => m.classList.remove('show'), ms);
}

/* ---- sequence ---- */
async function intro(){
  await wait(1200);
  // light theme -> dheere dheere dark, center mein focus
  document.body.classList.add('dark');
  tweenGlow(420, .5, 5000);
  fadeVol(song, 0, 3500).then(() => { try{localStorage.setItem(SONG_KEY, song.currentTime)}catch(e){} song.pause(); });
  await wait(5200);

  // table draw
  document.querySelectorAll('.t').forEach((el,i) => setTimeout(() => el.classList.add('go'), i*350));
  await wait(3600);
  document.querySelectorAll('.t').forEach(el => el.classList.add('fill'));
  await wait(1200);

  // cake girta hai
  $('cake').classList.add('drop');
  await wait(1700);
  $('cake').classList.remove('drop'); $('cake').classList.add('idle');

  say('Prachi, candle par click karo 🕯️');
  $('hint').style.display = ''; $('hit').style.display = '';
  $('hit').addEventListener('click', lightCandle, {once:true});
}

async function lightCandle(){
  $('hint').style.display = 'none'; $('hit').style.display = 'none';
  $('msg').classList.remove('show');
  lit = true; $('flameWrap').classList.add('on');
  document.body.style.background = '#030208';
  tweenGlow(300, .38, 2500);
  await wait(1600);
  $('popup').classList.add('show');
  startMic();
  setTimeout(() => $('kiss').classList.add('show'), 9000);
}

/* ---- mic blow detection ---- */
let micStream, micCtx, blown = false;
async function startMic(){
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    micCtx = new (window.AudioContext||window.webkitAudioContext)();
    const an = micCtx.createAnalyser(); an.fftSize = 1024;
    micCtx.createMediaStreamSource(micStream).connect(an);
    const buf = new Uint8Array(an.fftSize); let acc = 0, last = performance.now();
    (function loop(){
      if(blown) return;
      an.getByteTimeDomainData(buf);
      let s = 0; for(const v of buf){ const d=(v-128)/128; s+=d*d; }
      const rms = Math.sqrt(s/buf.length), lvl = Math.min(1, rms*5);
      $('flameBlow').style.transform = `skewX(${lvl*-22}deg) scale(${1-lvl*.25},${1-lvl*.2})`;
      const now = performance.now(), dt = now-last; last = now;
      if(rms > .12) acc += dt; else acc = Math.max(0, acc - dt*.5);
      if(acc > 380) return blowOut();
      requestAnimationFrame(loop);
    })();
  }catch(e){ $('kiss').classList.add('show'); }
}
$('kiss').addEventListener('click', blowOut);

async function blowOut(){
  if(blown) return; blown = true;
  if(micStream) micStream.getTracks().forEach(t => t.stop());
  $('popup').classList.remove('show'); $('kiss').classList.remove('show');
  $('flameBlow').style.transform = 'skewX(-40deg) scale(.3,.4)';
  $('flameWrap').classList.remove('on');
  $('smoke').classList.add('go');
  lit = false;
  tweenGlow(260, .12, 2500);
  launchBalloons(40);
  voice.play().catch(showNext);
  voice.addEventListener('ended', showNext, {once:true});
  voice.addEventListener('error', () => setTimeout(showNext, 1500), {once:true});
}

/* ---- balloons ---- */
function launchBalloons(n){
  const box = $('balloons'), cols = ['#ff4d6d','#ffb703','#4cc9f0','#b5179e','#80ed99','#ff8fab','#f72585','#7ae582','#ffd166','#9d4edd'];
  for(let i=0;i<n;i++){
    const w = 56 + Math.random()*46, c = cols[i%cols.length];
    const el = document.createElement('div'); el.className = 'balloon';
    el.style.left = (Math.random()*94) + '%';
    el.style.animationDuration = (7 + Math.random()*6) + 's';
    el.style.animationDelay = (Math.random()*2.8) + 's';
    const b = document.createElement('div'); b.className = 'b';
    b.style.width = w+'px'; b.style.height = w*1.22+'px';
    b.style.background = `radial-gradient(circle at 32% 28%, ${c}, ${c} 45%, rgba(0,0,0,.35) 130%)`;
    b.style.animationDuration = (2 + Math.random()*2) + 's';
    b.innerHTML = '<span class="shine"></span>';
    el.appendChild(b); box.appendChild(el);
    setTimeout(() => el.remove(), 16000);
  }
}

/* ---- next ---- */
function showNext(){ $('next').classList.add('show'); }
$('next').addEventListener('click', async () => {
  $('next').classList.remove('show');
  song.volume = 0; song.play().catch(()=>{});
  fadeVol(song, 1, 3000);
  document.body.style.background = '#fff6ea';
  tweenGlow(2400, 0, 3000);
  if(NEXT_URL){ await wait(2500); location.href = NEXT_URL; }
});

/* ---- secret code gate (PIN) ---- */
function gate(cb){
  const HP='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
  const g=$('gate'),dots=$('gdots'),msg=$('gmsg');let v='',tries=0,busy=false,played=false;
  dots.innerHTML=[...PIN].map(()=>`<svg viewBox="0 0 24 24"><path d="${HP}"/></svg>`).join('');
  const DEL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M13 9l4 6M17 9l-4 6"/></svg>';
  ['1','2','3','4','5','6','7','8','9','','0','del'].forEach(k=>{const b=document.createElement('button');
    if(k==='')b.className='e';else if(k==='del')b.innerHTML=DEL;else b.textContent=k;
    b.onclick=()=>press(k);$('gpad').append(b);});
  const upd=()=>[...dots.children].forEach((d,i)=>d.classList.toggle('on',i<v.length));
  function burstH(){for(let i=0;i<16;i++){const s=16+Math.random()*22;
    document.body.insertAdjacentHTML('beforeend',`<svg class="gh" viewBox="0 0 24 24" width="${s}" height="${s}" fill="currentColor" style="left:${innerWidth/2+(Math.random()-.5)*220}px;top:${innerHeight/2+(Math.random()-.5)*120}px;animation-delay:${Math.random()*.4}s"><path d="${HP}"/></svg>`);}
    setTimeout(()=>document.querySelectorAll('.gh').forEach(h=>h.remove()),2200);}
  function check(){busy=true;
    if(v===PIN){msg.textContent='Welcome, Prachi.';burstH();
      setTimeout(()=>{g.classList.add('out');setTimeout(()=>{g.remove();cb();},900);},1000);}
    else{tries++;dots.classList.add('sh');
      msg.textContent=(tries>=3&&HINT)?'Hint: '+HINT:'Not quite. Try again.';
      setTimeout(()=>{dots.classList.remove('sh');v='';upd();busy=false;},600);}}
  function press(k){if(busy)return;
    if(!played){played=true;song.play().catch(()=>{});}
    if(k==='del'){v=v.slice(0,-1);upd();return;}
    if(v.length>=PIN.length)return;v+=k;upd();if(v.length===PIN.length)check();}
  addEventListener('keydown',e=>{if(!document.getElementById('gate'))return;
    if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('del');});
}
gate(intro);
</script>
