<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Page 9 - Penguin ki Chitthi</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--LH:min(80vh,700px)}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1630;font-family:'Amiri',serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:0;right:0;bottom:9%;text-align:center;color:#ffe3ee;font-size:20px;
    letter-spacing:.5px;opacity:0;transition:opacity 1s;pointer-events:none;text-shadow:0 2px 10px #000}
  #hint.on{opacity:1;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{transform:translateY(-6px)}}
  #intro{position:fixed;top:7%;left:0;right:0;text-align:center;color:#ffd6e6;font-size:18px;opacity:.9;
    text-shadow:0 2px 8px #000;pointer-events:none;transition:opacity 1s}

  /* ---------- overlay ---------- */
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(60,10,30,.55),rgba(0,0,0,.9));z-index:10;opacity:0;transition:opacity 1s;overflow:hidden}
  #overlay.show{opacity:1}
  .heart{position:absolute;bottom:-30px;color:#ff6b9a;opacity:0;pointer-events:none;animation:rise linear forwards;z-index:11}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.7}100%{transform:translateY(-110vh) scale(1.2) rotate(20deg);opacity:0}}

  /* ---------- rolling scroll ---------- */
  #letter{position:relative;width:min(90vw,540px);height:46px;box-sizing:border-box;overflow:hidden;border-radius:8px;z-index:12;
    background:
      radial-gradient(circle at 20% 15%,rgba(255,255,255,.4),transparent 40%),
      radial-gradient(circle at 85% 90%,rgba(190,80,90,.25),transparent 45%),
      linear-gradient(135deg,#f7e6c4,#ecce98 55%,#dfb880);
    box-shadow:0 0 0 2px #8a5a1b inset,0 0 0 7px #f4e2b4 inset,0 0 0 9px #b0801f inset,0 25px 80px #000,0 0 90px rgba(255,100,150,.3);
    transition:height 3.2s cubic-bezier(.45,.05,.25,1)}
  #overlay.rolled #letter{height:var(--LH)}
  #letter::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:8px;box-shadow:0 0 55px 8px rgba(110,40,20,.4) inset}
  .rod{position:absolute;left:0;right:0;height:18px;z-index:6;background:linear-gradient(#5a2f0c,#c08a48 45%,#4a2608);
    box-shadow:0 3px 7px rgba(0,0,0,.55)}
  .rod.top{top:0;border-radius:9px 9px 0 0}.rod.bot{bottom:0;border-radius:0 0 9px 9px}
  .rod::before,.rod::after{content:"";position:absolute;top:-2px;width:14px;height:22px;border-radius:6px;background:#3d1f06}
  .rod::before{left:-3px}.rod::after{right:-3px}
  #inner{position:relative;height:var(--LH);box-sizing:border-box;padding:38px 26px 34px}

  /* Prachi ki photo - low opacity, fade in/out */
  #face{position:absolute;left:14px;right:14px;top:24px;bottom:24px;width:calc(100% - 28px);height:calc(100% - 48px);
    object-fit:cover;object-position:center 25%;opacity:0;pointer-events:none;mix-blend-mode:multiply;
    filter:sepia(.55) contrast(1.05);
    -webkit-mask-image:radial-gradient(ellipse at center,#000 35%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 35%,transparent 78%);
    animation:faceFade 8s ease-in-out infinite}
  @keyframes faceFade{0%,100%{opacity:.07;transform:scale(1)}50%{opacity:.26;transform:scale(1.04)}}

  #head{position:relative;text-align:center;font-family:'Cormorant Garamond','Amiri',serif;
    color:#6a1f2d;font-size:22px;letter-spacing:3px;margin-bottom:4px}
  #head small{display:block;font-size:14px;letter-spacing:2px;opacity:.85;font-family:'Amiri',serif;color:#5a3410}
  #orn{position:relative;text-align:center;color:#b3243f;margin:2px 0 10px;font-size:18px}
  #body{position:relative;height:calc(100% - 92px);overflow-y:auto;padding-right:4px;scrollbar-width:none;
    color:#3b1a10;font-size:20px;line-height:1.6}
  #body::-webkit-scrollbar{display:none}
  #body p{margin:0 0 14px;text-shadow:0 0 1px rgba(60,30,0,.25)}
  .caret{display:inline-block;width:2px;height:1em;background:#7a1f2d;margin-left:2px;vertical-align:-2px;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  #sign{text-align:right;font-style:italic;font-size:22px;color:#8a1f3a;opacity:0;transition:opacity 1.5s;margin-top:6px}
  #next{display:none;margin:16px auto 0;padding:10px 26px;border:0;border-radius:30px;font-family:inherit;font-size:19px;
    background:#a3203f;color:#ffe9ef;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  #skip{position:absolute;right:16px;top:24px;z-index:7;font-size:13px;color:#7b4a14;opacity:.75;background:none;border:0;font-family:inherit}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro">Barf ke paar se koi aa raha hai… ❄️💗</div>
<div id="hint">💌 Khat par tap karo</div>

<div id="overlay">
  <div id="letter">
    <div class="rod top"></div>
    <div id="inner">
      <button id="skip">skip ⏭</button>
      <!-- Prachi ki photo: Prachips.jpg isi folder me rakho -->
      <img id="face" src="Prachips.jpg" alt="" onerror="this.style.display='none'">
      <div id="head">MERI PRACHI KE NAAM<small>— ek penguin ki dil wali chitthi —</small></div>
      <div id="orn">❦ ♥ ❦</div>
      <div id="body"></div>
      <div id="sign"></div>
      <button id="next">Aage badho →</button>
    </div>
    <div class="rod bot"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================  APNA MESSAGE YAHAN BADLO  ===================== */
const TO   = "Meri pyaari Prachi";
const PARAS = [
  "Pata hai Prachi, penguin apne pyaar ko dhoondhne ke liye poora barf ka registan paar kar dete hain, aur mil jaaye to use duniya ka sabse chamakdaar kankad de dete hain.",
  "Aaj mere is chhote se penguin ke haath mein kankad nahi hai… isme mera poora dil hai, sirf tumhare liye. 💗",
  "Penguin ek baar jise chun le, to zindagi bhar uska saath nahi chhodta. Main bhi bas itna jaanta hoon ki meri har subah aur har shaam ab tumse hi poori hoti hai.",
  "Jab tum hansti ho na, is thandi duniya mein bhi dhoop khil jaati hai. Tumhari ek muskaan meri saari thakaan pighla deti hai.",
  "Sardi kitni bhi ho, tumhare saath ki garmahat sabse pyaari hai. Tumhara haath thaame main har tufaan paar kar loonga.",
  "Jo baat main zubaan se nahi keh paata, wo is chitthi ne keh di: main tumse bahut, bahut, bahut pyaar karta hoon. ❄️❤️"
];
const SIGN = "— Hamesha sirf tumhara, tumhara penguin 🐧❤️";
const TYPE_SPEED = 45;   // ms per letter (kam = tez)
const PARA_GAP   = 800;  // ms paragraphs ke beech
function onNext(){ /* yahan apna agla page kholo, e.g. location.href='page10.html' */ alert('Next page'); }
/* ======================================================================= */

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1630);
scene.fog = new THREE.Fog(0x0b1630, 8, 24);
const camera = new THREE.PerspectiveCamera(50, 1, .1, 60);
camera.position.set(0,1.7,6); camera.lookAt(0,.8,0);
function resize(){
  const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.fov = w<h?62:50; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

scene.add(new THREE.HemisphereLight(0xaac8ff,0x332244,.9));
const moon = new THREE.DirectionalLight(0xdfeaff,.9); moon.position.set(4,8,5); moon.castShadow=true; scene.add(moon);

const ground = new THREE.Mesh(new THREE.CircleGeometry(40,48), new THREE.MeshStandardMaterial({color:0xf4f8ff,roughness:.95}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
for(let i=0;i<30;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(Math.random()*.8+.3,12,8),new THREE.MeshStandardMaterial({color:0xffffff,roughness:1}));
  const a=Math.random()*Math.PI*2, r=4+Math.random()*14;
  m.position.set(Math.cos(a)*r*1.1, -.15, -Math.abs(Math.sin(a))*r-1.5); m.scale.y=.4; scene.add(m);
}
const N=900, pos=new Float32Array(N*3);
for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*24;pos[i*3+1]=Math.random()*10;pos[i*3+2]=(Math.random()-.5)*24-4;}
const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.BufferAttribute(pos,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.07,transparent:true,opacity:.9})));

/* penguin */
const mat=(c,r=.6)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const penguin=new THREE.Group(), bodyG=new THREE.Group(); penguin.add(bodyG);
function ell(g,c,sx,sy,sz,x=0,y=0,z=0){const m=new THREE.Mesh(new THREE.SphereGeometry(1,24,18),mat(c));m.scale.set(sx,sy,sz);m.position.set(x,y,z);m.castShadow=true;g.add(m);return m;}
ell(bodyG,0x15171c,.5,.72,.45,0,.85,0);
ell(bodyG,0xffffff,.38,.6,.3,0,.82,.22);
ell(bodyG,0x15171c,.34,.32,.32,0,1.62,.02);
ell(bodyG,0xffffff,.22,.2,.15,0,1.56,.22);
ell(bodyG,0xffffff,.05,.07,.04,-.12,1.68,.3); ell(bodyG,0xffffff,.05,.07,.04,.12,1.68,.3);
ell(bodyG,0x000000,.025,.04,.02,-.12,1.68,.33); ell(bodyG,0x000000,.025,.04,.02,.12,1.68,.33);
ell(bodyG,0xff8fb0,.06,.035,.02,-.24,1.56,.28); ell(bodyG,0xff8fb0,.06,.035,.02,.24,1.56,.28); // blush
const beak=new THREE.Mesh(new THREE.ConeGeometry(.08,.22,12),mat(0xff9a1f));
beak.rotation.x=Math.PI/2; beak.position.set(0,1.57,.38); beak.castShadow=true; bodyG.add(beak);
function flipper(side){const p=new THREE.Group(); p.position.set(side*.46,1.2,.05);
  ell(p,0x15171c,.08,.38,.16,0,-.3,0); p.rotation.z=side*.25; bodyG.add(p); return p;}
const fL=flipper(-1), fR=flipper(1);
function foot(x){const p=new THREE.Group();p.position.set(x,.08,.1); ell(p,0xff9a1f,.2,.06,.3,0,0,.12); penguin.add(p);return p;}
const footL=foot(-.2), footR=foot(.2);

/* envelope */
function makeEnvelope(){
  const g=new THREE.Group(), w=.8,h=.52,d=.04;
  const base=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(0xfbe9ee,.8)); base.castShadow=true; g.add(base);
  const tri=new THREE.Shape(); tri.moveTo(-w/2,h/2); tri.lineTo(w/2,h/2); tri.lineTo(0,-.05); tri.closePath();
  const flap=new THREE.Mesh(new THREE.ShapeGeometry(tri),new THREE.MeshStandardMaterial({color:0xf3cfdb,roughness:.8,side:THREE.DoubleSide}));
  flap.position.z=d/2+.002; g.add(flap);
  const hs=new THREE.Shape(); hs.moveTo(0,-.04); hs.bezierCurveTo(-.09,.05,-.06,.11,0,.06); hs.bezierCurveTo(.06,.11,.09,.05,0,-.04);
  const heart=new THREE.Mesh(new THREE.ShapeGeometry(hs),new THREE.MeshStandardMaterial({color:0xd01f4a,roughness:.4,side:THREE.DoubleSide}));
  heart.scale.set(1.3,1.3,1); heart.position.set(0,-.05,d/2+.01); g.add(heart);
  return g;
}
const env=makeEnvelope(); scene.add(env); scene.add(penguin);

/* timeline */
const START_Z=-13, STOP_Z=1.0, DROP_POS=new THREE.Vector3(0,.03,2.3);
const T_WALK=8, T_DROP=1.6, T_BACK=6;
let t0=performance.now(), phase='walk', clickable=false, opened=false;
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const hint=document.getElementById('hint'), intro=document.getElementById('intro');
function waddle(t,speed,dir){
  bodyG.rotation.z=Math.sin(t*speed)*.12;
  footL.position.z=.1+Math.max(0,Math.sin(t*speed))*.25*dir;
  footR.position.z=.1+Math.max(0,-Math.sin(t*speed))*.25*dir;
  footL.position.y=.08+Math.max(0,Math.sin(t*speed))*.08;
  footR.position.y=.08+Math.max(0,-Math.sin(t*speed))*.08;
  bodyG.position.y=Math.abs(Math.sin(t*speed))*.05;
}
function tick(now){
  const t=(now-t0)/1000, p=sg.attributes.position;
  for(let i=0;i<N;i++){let y=p.array[i*3+1]-.012-(i%5)*.002; p.array[i*3]+=Math.sin(now*.0005+i)*.002; if(y<0)y=10; p.array[i*3+1]=y;}
  p.needsUpdate=true;
  if(phase==='walk'){
    const k=Math.min(t/T_WALK,1);
    penguin.position.z=START_Z+(STOP_Z-START_Z)*ease(k);
    waddle(t,9,1); fL.rotation.x=fR.rotation.x=-1.0;
    env.position.set(0,1.0,penguin.position.z+.55); env.rotation.set(-.15,0,0);
    if(k>=1){phase='drop';t0=now;}
  }else if(phase==='drop'){
    const k=Math.min(t/T_DROP,1), e=ease(k);
    bodyG.rotation.z=0; bodyG.position.y=0; footL.position.set(-.2,.08,.1); footR.position.set(.2,.08,.1);
    bodyG.rotation.x=e*.55; fL.rotation.x=fR.rotation.x=-1.0+e*.4;
    const sy=1.0, sz=STOP_Z+.55;
    env.position.set(DROP_POS.x*e, sy+(DROP_POS.y-sy)*e+Math.sin(e*Math.PI)*.1, sz+(DROP_POS.z-sz)*e);
    env.rotation.x=-.15+(-Math.PI/2+.15)*e;
    if(k>=1){phase='back';t0=now;clickable=true;hint.classList.add('on');intro.style.opacity=0;}
  }else if(phase==='back'){
    const k=Math.min(t/T_BACK,1);
    bodyG.rotation.x*=.9; fL.rotation.x=fR.rotation.x=-.2*(1-k);
    penguin.position.z=STOP_Z-(STOP_Z-START_Z)*ease(k)*.95;
    waddle(t,8,-1);
    if(k>=1){phase='idle';penguin.visible=false;}
  }
  if(clickable){ env.position.y=DROP_POS.y+.02+Math.sin(now*.004)*.012; }
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* letter: roll open -> typewriter */
const overlay=document.getElementById('overlay'), bodyEl=document.getElementById('body'),
      signEl=document.getElementById('sign'), nextBtn=document.getElementById('next');
let skipFlag=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function spawnHearts(){
  setInterval(()=>{
    const h=document.createElement('div'); h.className='heart'; h.textContent=Math.random()>.5?'♥':'❤';
    h.style.left=Math.random()*100+'vw'; h.style.fontSize=(12+Math.random()*18)+'px';
    h.style.animationDuration=(6+Math.random()*5)+'s'; overlay.appendChild(h);
    setTimeout(()=>h.remove(),11500);
  },700);
}
function openLetter(){
  if(!clickable||opened)return; opened=true; hint.classList.remove('on'); hint.style.opacity=0;
  overlay.style.display='flex';
  requestAnimationFrame(()=>requestAnimationFrame(()=>overlay.classList.add('show')));
  setTimeout(()=>overlay.classList.add('rolled'),900);   // khat dheere dheere rolling karke khulta hai
  setTimeout(runLetter,900+3400);                        // khulne ke baad typewriter shuru
  spawnHearts();
}
canvas.addEventListener('click',openLetter);
canvas.addEventListener('touchend',openLetter);

async function runLetter(){
  const all=[TO+",",...PARAS];
  for(let i=0;i<all.length;i++){
    const p=document.createElement('p'); bodyEl.appendChild(p);
    const caret=document.createElement('span'); caret.className='caret';
    const txt=document.createTextNode(''); p.appendChild(txt); p.appendChild(caret);
    const s=all[i];
    for(let c=0;c<s.length;c++){
      if(skipFlag){txt.nodeValue=s;break;}
      txt.nodeValue=s.slice(0,c+1); bodyEl.scrollTop=bodyEl.scrollHeight;
      await sleep(TYPE_SPEED + (/[,.!?]/.test(s[c])?160:0));
    }
    txt.nodeValue=s; caret.remove();
    if(!skipFlag) await sleep(PARA_GAP);
  }
  signEl.textContent=SIGN; signEl.style.opacity=1;
  nextBtn.style.display='block'; bodyEl.scrollTop=bodyEl.scrollHeight;
}
document.getElementById('skip').onclick=()=>{skipFlag=true;};
nextBtn.onclick=onNext;
</script>
</body>
</html>
